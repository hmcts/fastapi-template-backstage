services:
  ${{ values.component }}:
    build:
      context: .
      args:
        - http_proxy
        - https_proxy
        - no_proxy
    image: ${{ values.acr_registry }}.azurecr.io/${{ values.product }}/${{ values.component }}
    ports:
      - ${{ values.http_port }}:${{ values.http_port }}
